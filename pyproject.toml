[project]
name = "derivados101"
version = "0.1.0"
description = "App educativa para entender derivados de moneda (USD/CLP): forwards, opciones y estrategias."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sergio Domínguez" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
